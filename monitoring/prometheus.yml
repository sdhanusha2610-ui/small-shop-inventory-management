# ==============================================================================
# Small Shop Inventory Management System - Prometheus Configuration
# Scrapes EC2 Node Exporter (System Metrics) and Flask Application Metrics
# ==============================================================================

global:
  scrape_interval: 15s     # How frequently to scrape targets
  evaluation_interval: 15s # How frequently to evaluate alert rules
  scrape_timeout: 10s

# Alerting rule files
rule_files:
  - "alerts.yml"

# Scrape Configurations
scrape_configs:
  # 1. Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. EC2 Node Exporter (CPU, RAM, Disk, Network)
  - job_name: "ec2_node_exporter"
    static_configs:
      - targets: ["host.docker.internal:9100", "127.0.0.1:9100"]
        labels:
          environment: "production"
          service: "ec2-host"

  # 3. Flask Inventory Application Metrics (/metrics)
  - job_name: "flask_inventory_app"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:5000", "127.0.0.1:5000", "host.docker.internal:5050"]
        labels:
          environment: "production"
          app: "small-shop-inventory"
