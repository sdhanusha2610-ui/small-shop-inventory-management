server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Client body limit for uploads
    client_max_body_size 16M;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Static Assets Direct Delivery (Bypasses Python for high performance)
    location /static/ {
        alias /opt/inventory-system/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy all application requests to Gunicorn WSGI server
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Node Exporter metrics endpoint restricted if exposed through Nginx
    location /node-metrics {
        proxy_pass http://127.0.0.1:9100/metrics;
    }
}
