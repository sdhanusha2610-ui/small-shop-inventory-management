name: CI/CD Pipeline - Test & Zero-SSH Deploy to EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  # ============================================================================
  # 1. CONTINUOUS INTEGRATION (CI): Linting & Automated Pytest Suite
  # ============================================================================
  ci-test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Code Linter (Flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning-only check for formatting
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Automated Pytest Suite
        env:
          FLASK_ENV: testing
          ENABLE_SNS_ALERTS: 'false'
        run: |
          pytest -v --cov=app tests/

  # ============================================================================
  # 2. CONTINUOUS DEPLOYMENT (CD): Deploy to EC2 via AWS Systems Manager (SSM)
  # ============================================================================
  cd-deploy:
    name: Deploy to Amazon EC2 via AWS SSM
    needs: ci-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Execute Deployment via AWS SSM Run Command
        id: ssm_deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          echo "Dispatching deployment command to EC2 instance: $INSTANCE_ID..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions Automated Deployment for Small Shop Inventory" \
            --parameters 'commands=[
              "set -e",
              "echo \"Deploying latest commit to /opt/inventory-system...\"",
              "cd /opt/inventory-system",
              "git config --global --add safe.directory /opt/inventory-system",
              "git fetch origin main",
              "git reset --hard origin/main",
              "chown -R ubuntu:www-data /opt/inventory-system",
              "source /opt/inventory-system/venv/bin/activate",
              "pip install -r requirements.txt",
              "python scripts/init_db.py",
              "systemctl restart inventory",
              "systemctl restart nginx",
              "echo \"Verifying application health...\"",
              "sleep 3",
              "curl -f -s http://127.0.0.1:5000/health > /dev/null && echo \"Application is healthy!\""
            ]' \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command dispatched with ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Poll SSM Command Status & Verify Health
        run: |
          echo "Waiting for deployment command $COMMAND_ID to finish on EC2..."
          
          # Poll status up to 120 seconds
          for i in {1..24}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Current Status: $STATUS (Attempt $i/24)"

            if [ "$STATUS" == "Success" ]; then
              echo "✅ Deployment succeeded!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ] || [ "$STATUS" == "TimedOut" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi

            sleep 5
          done

          echo "❌ Timed out waiting for SSM command execution."
          exit 1
